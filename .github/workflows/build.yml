name: Build
on:
  push:
  workflow_dispatch:

jobs:
  web-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:routing
      - run: npm run test:realtime
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: kompack-web, path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: kompack-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with: { name: kompack-windows, path: src-tauri/target/release/bundle/nsis/*.exe }
